function collector(){if(tab==='Inventory'){const previous=tab;try{tab='My inventory';const inventory=collector();tab='Company needs';const demand=document.createElement('template');demand.innerHTML=collector();demand.content.querySelector('.workspace-title')?.remove();return inventory+demand.innerHTML;}finally{tab=previous;}}const collected=state.lots.filter(l=>l.status==='collected'),reserved=state.lots.filter(l=>l.status==='reserved'),transferred=state.lots.filter(l=>l.status==='transferred');if(tab==='Collection map'){const rs=state.requests.filter(r=>r.area===area&&r.status!=='collected');return title('Collection partner / Delhi','The next good hand<br>could be yours.','Find material ready for collection, one neighbourhood at a time.','', 'cardboard')+metrics([[String(rs.length),'Your open opportunities'],[kg(DemoModel.sum(collected)),'Available collected inventory'],[kg(DemoModel.sum(reserved)),'Reserved for transfer'],[kg(DemoModel.sum(transferred)),'Transferred to recyclers']])+`<div class="map-layout"><section><div class="section-heading"><h2>Delhi, by neighbourhood.</h2><small>Locality-level view</small></div>${delhiMap()}<p class="note">This is an illustrated locality preview, not road navigation. Density labels are sample fixtures. Household identities and exact locations are never shown.</p></section><section><div class="section-heading"><h2>${area}</h2><span class="badge">${rs.length} live demo requests</span></div>${rs.length?rs.map(r=>opportunity(r)).join(''):`<div class="empty"><h3>No open collection requests.</h3><p>Add materials and request collection from the Household page to see the full journey.</p>${button('Go to household '+icon('arrow'),'go-household','secondary')}</div>`}<div class="section-heading" style="margin-top:25px"><h3>Neighbourhood preview</h3><span class="badge">Illustrative</span></div><div class="opportunity"><div class="opportunity-head"><h3>Mixed recyclable bundle</h3><span class="badge">12 kg</span></div><p>Paper, PET & cardboard · Area-level sample</p><p>Value: awaiting a backend quote</p></div>${button(icon('route')+' Preview selected route','plan-route','secondary','style="margin-top:20px"')}<div id="route-result">${routeVisible?routePreview():''}</div></section></div>`;}

function opportunity(r){const ms=state.materials.filter(m=>r.materialIds.includes(m.id));return `<article class="opportunity"><div class="opportunity-head"><h3>Recyclables ready · ${kg(r.quantityKg)}</h3><span class="badge active">${r.status}</span></div><p>${[...new Set(ms.map(m=>names[m.type]))].join(', ')} · ${r.area}</p><p>${ms.every(m=>m.estimatedValue!=null)?'Sample estimate: '+money(ms.reduce((s,m)=>s+m.estimatedValue,0)):'Value: awaiting a backend quote'}</p><div class="opportunity-actions"><label><input type="checkbox" data-stop="${r.id}" ${selectedStops.has(r.id)?'checked':''}> Route stop</label>${r.status==='pending'?button('Accept','accept','','data-id="'+r.id+'"')+button('Decline','reject','secondary','data-id="'+r.id+'"'):button(icon('check')+' Mark collected','collect','','data-id="'+r.id+'"')}</div></article>`;}
function routePreview(){const rs=state.requests.filter(r=>selectedStops.has(r.id)&&r.area===area&&r.status!=='collected');return `<div class="route-preview"><h3>${rs.length} selected stop${rs.length===1?'':'s'} · ${area}</h3><p>${rs.map((r,i)=>`${i+1}. Area-level bundle · ${kg(r.quantityKg)}`).join('<br>')}</p><p class="muted">Local preview only. Distance, duration and road routing require the supplied backend; no precise home locations are included.</p></div>`;}
function requestTable(){return state.requests.length?`<div class="table-scroll"><table><thead><tr><th>Locality</th><th>Material</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.requests.map(r=>`<tr><td>${r.area}</td><td>${kg(r.quantityKg)}</td><td><span class="badge active">${r.status}</span></td><td>${r.status==='accepted'?button('Mark collected','collect','','data-id="'+r.id+'"'):r.status==='pending'?button('Accept','accept','','data-id="'+r.id+'"'):'Collection recorded'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h3>Your collection record is empty.</h3><p>Accept a household collection request to begin.</p></div>`;}
function requirementRow(r){return `<article class="requirement-row"><div><span class="eyebrow">${esc(r.company)}</span><h3>${names[r.type]}</h3><p>${kg(r.quantityKg-r.fulfilledKg)} still needed · Delhi</p></div><div><small>${kg(r.fulfilledKg)} / ${kg(r.quantityKg)} fulfilled</small><div class="progressbar"><span style="width:${Math.min(100,r.fulfilledKg/r.quantityKg*100)}%"></span></div></div><span class="badge active">${r.status.replaceAll('_',' ')}</span></article>`;}
function recycler(){const avail=state.lots.filter(l=>l.status==='collected'),booked=state.bookings.filter(b=>b.status==='confirmed'),done=state.bookings.filter(b=>b.status==='completed');if(tab==='Requirements'){return title('Your material demand','Give the next life<br>a clear direction.','Tell collection partners which materials your company needs.',button(icon('plus')+' New requirement','add-requirement'),'paper')+`<div class="section-heading"><h2>Your requirements</h2><small>${state.requirements.length} material requests</small></div>${state.requirements.map(requirementRow).join('')}${sampleNotice()}`;}
if(tab==='Bookings'){return title('Reserved → Transferred','A reservation is a promise.<br>A handover is a record.','Bookings reserve material immediately. Confirm only when the material has been handed over.')+metrics([[String(booked.length),'Active reservations'],[kg(DemoModel.sum(booked)),'Reserved quantity'],[kg(DemoModel.sum(done)),'Confirmed transfers'],['Not verified','Actual recycling']])+`<div class="section-heading"><h2>Your bookings</h2></div>${state.bookings.length?`<div class="table-scroll"><table><thead><tr><th>Material</th><th>Partner</th><th>Quantity</th><th>Status</th><th>Handover</th></tr></thead><tbody>${state.bookings.map(b=>`<tr><td>${names[b.type]}</td><td>${esc(b.partner)}</td><td>${kg(b.quantityKg)}</td><td><span class="badge active">${b.status==='confirmed'?'Reserved':'Transferred'}</span></td><td>${b.status==='confirmed'?button('Confirm handover','confirm-booking','','data-id="'+b.id+'"'):'Handover recorded'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h3>No bookings yet.</h3><p>Reserve a matching lot in the material marketplace.</p>${button('Explore materials '+icon('arrow'),'marketplace','secondary')}</div>`}${sampleNotice()}`;}
if(tab==='Company profile'){return title('Recycler / Company','Put a name<br>to the next beginning.','Your company details accompany the requirements you publish.')+`<div class="profile-grid"><form id="company-form"><div class="field"><label for="company-name">Company name</label><input id="company-name" name="name" value="${esc(state.company.name)}" maxlength="80" required></div><div class="field"><label for="company-locality">Company locality</label><input id="company-locality" name="locality" value="${esc(state.company.locality)}" maxlength="120" required></div><div class="field"><label for="company-contact">Company contact email (optional)</label><input id="company-contact" name="contact" type="email" value="${esc(state.company.contact)}" placeholder="materials@yourcompany.in"></div><button class="btn" type="submit">${icon('check')} Save company profile</button><p class="note">Saved to the live demonstration profile for this recycler.</p></form><section><h2>Demand meets<br>the existing economy.</h2><p class="muted" style="font-size:13px;margin-top:20px">Publish material requirements, find collected inventory, reserve a lot and record its handover.</p>${sampleNotice()}</section></div>`;}
return title('Recycler / Delhi','The next life<br>starts with the right material.','Discover materials already collected by local partners.',button(icon('plus')+' New requirement','add-requirement'), 'glass')+metrics([[kg(DemoModel.sum(avail)),'Available in sample marketplace'],[String(state.requirements.filter(r=>r.status!=='fulfilled').length),'Open requirements'],[kg(DemoModel.sum(booked)),'Reserved for you'],[kg(DemoModel.sum(done)),'Confirmed transfers']])+`<div class="section-heading"><h2>Material, ready for its next life.</h2><small>Collected inventory</small></div><div class="filter-bar" role="group" aria-label="Filter material">${['all',...DemoModel.types].map(t=>`<button class="chip ${filter===t?'selected':''}" data-action="filter" data-filter="${t}" aria-pressed="${filter===t}">${t==='all'?'All materials':names[t]}</button>`).join('')}</div><div class="market-list">${avail.filter(l=>filter==='all'||l.type===filter).map(l=>lotCard(l)).join('')||`<div class="empty"><h3>No ${filter==='all'?'available':names[filter].toLowerCase()} lots.</h3><p>Matching collected materials will appear here.</p>${button('Show all materials','all-materials','secondary')}</div>`}</div>${sampleNotice()}`;}
function lotCard(l){return `<article class="lot-card"><div class="lot-top"><div><p class="eyebrow">Collected material</p><div class="lot-quantity">${kg(l.quantityKg)}</div></div><img src="${MEDIA.materials[l.type]}" width="100" height="100" alt="${names[l.type]}" loading="lazy"></div><div class="lot-body"><h3>${names[l.type]}</h3><p>${esc(l.partner)}</p><div class="lot-meta"><span>${icon('pin').replace('<svg','<svg width="12" height="12"')} ${l.area}</span><span>Quote pending</span></div>${button('Reserve material '+icon('arrow'),'reserve','','data-id="'+l.id+'"')}</div></article>`;}
function openModal(title,body){modal.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close-modal" title="Close" aria-label="Close dialog">${icon('close')}</button></div>${body}`;modal.showModal();}
function typeOptions(value='paper'){return DemoModel.types.map(t=>`<option value="${t}" ${value===t?'selected':''}>${names[t]}</option>`).join('');}
function materialForm(m=null,photo=false){openModal(m?'Edit material':photo?'From a photo':'Add a material',`<form id="material-form" data-id="${m?.id||''}" data-photo="${photo}">${photo?`<div class="upload-zone"><img id="photo-preview" hidden alt="Your uploaded material"><p id="photo-help">Choose one dominant material to identify.</p><label class="btn secondary" for="material-photo">${icon('camera')} Choose a photo</label><input id="material-photo" type="file" accept="image/jpeg,image/png" hidden></div><div class="photo-result" id="photo-result" aria-live="polite"><span class="eyebrow">Recognition result</span><strong id="photo-result-title">Waiting for a photo</strong><p id="photo-result-copy">Your material suggestion will appear here.</p></div>`:''}<div class="form-pair"><div class="field"><label for="material-type">Material</label><select id="material-type" name="type">${typeOptions(m?.type)}</select></div><div class="field"><label for="material-kg">Weight (kg)</label><input id="material-kg" name="weight" type="number" min="0.01" max="100000" step="0.01" value="${m?.quantityKg||''}" placeholder="e.g. 2.5" required></div></div>${photo?'<label class="confirm-material"><input type="checkbox" name="confirm" required> <span>I confirm this material identification.</span></label>':''}<p class="error-message" id="form-error" role="alert"></p><div class="modal-actions">${button('Cancel','close-modal','secondary')}<button class="btn" id="material-submit" type="submit">${icon('check')} ${m?'Save changes':photo?'Confirm material':'Add material'}</button></div></form>`);}
function newRequirement(){openModal('What does your company need?',`<form id="requirement-form"><p class="muted" style="font-size:12px;margin-bottom:20px">${esc(state.company.name)} · ${esc(state.company.locality)}</p><div class="form-pair"><div class="field"><label for="requirement-type">Material needed</label><select id="requirement-type" name="type">${typeOptions()}</select></div><div class="field"><label for="requirement-kg">Required weight (kg)</label><input id="requirement-kg" name="weight" type="number" min="0.01" max="1000000" step="0.01" placeholder="e.g. 100" required></div></div><div class="field"><label for="requirement-minimum">Minimum booking (kg, optional)</label><input id="requirement-minimum" name="minimum" type="number" min="0" max="1000000" step="0.01" placeholder="e.g. 25"></div><p class="error-message" id="form-error" role="alert"></p><div class="modal-actions">${button('Cancel','close-modal','secondary')}<button class="btn" type="submit">${icon('plus')} Publish requirement</button></div><p class="note">This requirement is visible to the collection partner in this demonstration.</p></form>`);}
function reserve(lotId){const l=state.lots.find(l=>l.id===lotId);if(!l)return;const rs=state.requirements.filter(r=>r.type===l.type&&r.status!=='fulfilled'&&r.quantityKg-r.fulfilledKg>=Math.max(r.minimumKg||0,0.01));openModal('Reserve this material',`<form id="booking-form" data-id="${l.id}"><div class="partner-row"><img src="${MEDIA.materials[l.type]}" width="65" height="65" alt=""><div><h3>${names[l.type]} · ${kg(l.quantityKg)} available</h3><p>${esc(l.partner)} · ${l.area}</p></div></div>${rs.length?`<div class="field" style="margin-top:20px"><label for="booking-requirement">Match to your requirement</label><select id="booking-requirement" name="requirement">${rs.map(r=>`<option value="${r.id}">${names[r.type]} · ${kg(r.quantityKg-r.fulfilledKg)} remaining${r.minimumKg?` · min ${kg(r.minimumKg)}`:''}</option>`).join('')}</select></div><div class="field"><label for="booking-quantity">Quantity to reserve (kg)</label><input id="booking-quantity" name="quantity" type="number" min="0.01" max="${l.quantityKg}" step="0.01" value="${l.quantityKg}" required></div><p class="note">The quantity is reserved immediately. Material transfers only after you confirm the handover.</p><p class="error-message" id="form-error" role="alert"></p><div class="modal-actions">${button('Cancel','close-modal','secondary')}<button class="btn" type="submit">Reserve material</button></div>`:`<p class="note">You need a matching requirement before reserving this material.</p><div class="modal-actions">${button('Create requirement','add-requirement')}</div>`}</form>`);}
function confirmDialog(title,copy,action,id){openModal(title,`<p style="font-size:13px">${copy}</p><div class="modal-actions">${button('Cancel','close-modal','secondary')}${button('Confirm '+icon('check'),action,'','data-id="'+id+'"')}</div>`);}
function perform(fn,msg){try{fn();render();toast(msg);}catch(e){if(modal.open&&$('#form-error',modal))$('#form-error',modal).textContent=e.message;else toast(e.message);}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
