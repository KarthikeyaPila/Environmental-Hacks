<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delhi Map</title>
<style>
html,body{margin:0;background:#e6d3ab}
.box{position:relative;max-width:900px;margin:0 auto}
svg{display:block;width:100%;height:auto;max-height:100vh}
.hit{fill:transparent;stroke:transparent;stroke-width:3;stroke-linejoin:round;cursor:pointer;outline:none;transition:fill .25s,stroke .25s}
.hit:hover,.hit:focus-visible,.hit.sel{fill:rgba(255,244,205,.3);stroke:#fff;filter:drop-shadow(0 0 3px rgba(255,200,80,.9)) drop-shadow(0 5px 7px rgba(40,25,5,.45))}
.lab{font:600 11px system-ui,sans-serif;fill:#2b2118;stroke:#f6ecd2;stroke-width:3;paint-order:stroke;text-anchor:middle;pointer-events:none}
.tip{position:absolute;pointer-events:none;background:#fbf8f1;color:#1f3a2b;border:1px solid #c9c2a6;border-radius:16px;padding:10px 14px;box-shadow:0 10px 24px rgba(40,25,5,.28);opacity:0;transition:opacity .15s;min-width:200px;z-index:2}
.tip.show{opacity:1}
.tip b{font:400 20px Georgia,serif;display:block;margin-bottom:6px}
.tip div{display:flex;justify-content:space-between;gap:16px;font:13px system-ui,sans-serif;padding:2px 0;border-top:1px solid #e4e0d2}
.tip span{color:#5d7366}.tip em{font-style:normal;font-weight:600}
</style></head>
<body><div class="box" id="box"><svg id="map" viewBox="20 15 685 735" role="group" aria-label="Map of Delhi districts"></svg><div class="tip" id="tip" role="status"></div></div>
<script>
/* Boundaries (replaceable) */
const GEO={loc:[
{id:"north",name:"North",pts:"190,120 210,110 225,95 250,88 290,95 300,70 310,50 325,45 345,25 355,40 375,48 395,55 400,57 410,58 425,70 432,85 445,92 462,90 470,100 500,115 530,128 528,135 505,145 500,165 510,168 495,170 480,185 462,188 478,195 472,215 470,238 480,255 495,260 518,258 525,270 515,290 497,303 475,315 450,275 447,258 433,255 420,272 412,290 400,290 398,265 385,242 365,240 350,248 330,240 300,226 258,213 255,178 240,165 215,160 198,148"},
{id:"north-west",name:"North West",pts:"190,120 198,148 215,160 240,165 255,178 258,213 300,226 330,240 350,248 365,240 385,242 398,265 400,290 412,290 420,272 433,255 447,258 450,275 475,315 468,340 455,355 447,348 430,342 412,335 400,318 355,316 315,320 300,302 262,303 245,328 210,300 185,300 170,285 172,250 180,215 172,195 170,165 185,135"},
{id:"west",name:"West",pts:"185,300 210,300 245,328 262,303 300,302 315,320 355,316 400,318 412,335 430,342 447,348 455,355 470,380 478,395 468,405 455,400 440,395 410,392 395,402 385,418 372,430 345,415 320,410 308,425 300,440 285,437 275,413 245,408 240,370 235,360 190,357 180,350 188,325"},
{id:"south-west",name:"South West",pts:"180,350 150,345 142,365 150,380 165,400 160,415 125,400 95,398 60,445 40,465 28,480 30,520 65,545 80,575 95,595 110,565 135,570 165,583 190,585 215,570 240,550 255,560 270,545 300,560 335,570 370,580 335,542 325,520 308,505 320,495 340,485 358,455 372,430 345,415 320,410 308,425 300,440 285,437 275,413 245,408 240,370 235,360 190,357"},
{id:"central",name:"Central",pts:"510,168 522,190 528,215 530,250 538,265 540,310 550,335 573,345 583,365 570,397 556,412 520,390 500,383 490,390 478,395 470,380 455,355 468,340 475,315 497,303 515,290 525,270 518,258 495,260 480,255 470,238 472,215 478,195 462,188 480,185 495,170"},
{id:"new-delhi",name:"New Delhi",pts:"372,430 358,455 340,485 320,495 308,505 325,520 335,542 370,580 375,590 390,615 408,612 425,622 437,597 440,568 465,545 455,532 470,527 485,502 508,485 505,462 530,452 558,433 556,412 520,390 500,383 490,390 478,395 468,405 455,400 440,395 410,392 395,402 385,418"},
{id:"north-east",name:"North East",pts:"510,168 535,190 548,215 575,240 590,250 612,262 630,285 625,300 610,318 595,325 573,345 550,335 540,310 538,265 530,250 528,215 522,190"},
{id:"shahdara",name:"Shahdara",pts:"630,285 665,278 668,300 660,330 655,390 630,368 600,365 583,365 573,345 595,325 610,318 625,300"},
{id:"east",name:"East",pts:"583,365 600,365 630,368 655,390 650,410 675,420 688,435 680,455 660,462 640,465 625,470 610,455 588,440 572,420 558,433 556,412 570,397"},
{id:"south-east",name:"South East",pts:"558,433 572,420 588,440 610,455 625,470 640,465 650,490 670,520 690,565 660,590 620,605 590,615 555,625 558,590 555,560 545,525 535,495 520,478 505,462 530,452"},
{id:"south",name:"South",pts:"505,462 520,478 535,495 545,525 555,560 558,590 555,625 550,650 558,690 552,710 520,725 480,735 462,725 445,705 425,690 405,672 395,650 385,635 390,615 408,612 425,622 437,597 440,568 465,545 455,532 470,527 485,502 508,485"}],
river:"M515,128C512,150 515,170 522,190L528,215L530,250L538,265L540,310L550,335L573,345L583,365L570,397L556,412L558,433L538,452L525,480L535,495L545,525L555,560L558,590L555,625",
parks:{north:[[300,160,24],[445,160,20]],"north-west":[[215,230,22],[425,300,16]],west:[[300,370,18]],"south-west":[[130,490,26],[220,430,18]],"new-delhi":[[420,450,18]],"north-east":[[575,275,14,"#d9a45a",0]],shahdara:[[640,335,14,"#93b55e",0]],"south-east":[[640,545,20,"#93b55e",0]],south:[[505,540,16],[480,670,28]]}};
/* Demo data: [pending requests, kg, rupees] */
const DATA={north:[14,212,3180],"north-west":[16,260,3900],west:[11,175,2625],"south-west":[18,290,4350],central:[7,122,1830],"new-delhi":[5,84,1260],"north-east":[9,148,2220],shahdara:[13,201,3015],east:[6,102,1530],"south-east":[12,194,2910],south:[8,131,1965]};

const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const H=id=>[...id].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7),P=s=>s.split(" ").map(p=>p.split(",").map(Number)),f=n=>n.toFixed(1);
const inside=(x,y,p)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++)if((p[i][1]>y)!=(p[j][1]>y)&&x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0])c=!c;return c};
const PAL=["#c9694a","#c9694a","#d98b5f","#d98b5f","#e3b36a","#e3b36a","#ecdcb8","#ecdcb8","#7197bd","#b84f3a","#86a374","#f1e4c4"];
function city(pts,id,park){
 const R=rng(H(id)),a=((H(id)%50)-20)*Math.PI/180,co=Math.cos(a),si=Math.sin(a),s=8;
 const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,r=Math.hypot(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))/2;
 const T=(u,v)=>[cx+u*co-v*si,cy+u*si+v*co],B={},sh=[];let roads="";
 for(let i=-Math.ceil(r/s);i<=r/s;i++){if(((i%6)+6)%6===5){const A=T(i*s,-r),C=T(i*s,r),D=T(-r,i*s),E=T(r,i*s);roads+=`M${f(A[0])},${f(A[1])}L${f(C[0])},${f(C[1])}M${f(D[0])},${f(D[1])}L${f(E[0])},${f(E[1])}`}
  for(let j=-Math.ceil(r/s);j<=r/s;j++){
   if(((i%6)+6)%6===5||((j%6)+6)%6===5)continue;
   const q=T(i*s,j*s);if(!inside(q[0],q[1],pts)||park.some(k=>Math.hypot(q[0]-k[0],q[1]-k[1])<k[2])||R()<.04)continue;
   const w=s*(.6+R()*.25),h=s*(.6+R()*.25),c=PAL[R()*PAL.length|0],g=[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([x,y])=>T(i*s+x,j*s+y));
   (B[c]=B[c]||[]).push("M"+g.map(p=>f(p[0])+","+f(p[1])).join("L")+"Z");
   sh.push("M"+g.map(p=>f(p[0]+1.4)+","+f(p[1]+1.6)).join("L")+"Z")}}
 let o=`<path d="${sh.join("")}" fill="rgba(40,25,10,.35)"/>`;
 for(const c in B)o+=`<path d="${B[c].join("")}" fill="${c}"/>`;
 o+=`<path d="${roads}" stroke="#4a4540" stroke-width="2" fill="none"/>`;
 park.forEach(([x,y,rr,c,n])=>{o+=`<ellipse cx="${x}" cy="${y}" rx="${rr}" ry="${rr*.85}" fill="${c||"#86a86f"}"/>`;
  for(let k=0;k<(n===0?0:Math.round(rr*1.1));k++){const t=R()*6.28,d=Math.sqrt(R())*rr*.85;o+=`<circle cx="${f(x+Math.cos(t)*d)}" cy="${f(y+Math.sin(t)*d*.85)}" r="${f(2+R()*1.8)}" fill="#4d7a43" stroke="#35592f" stroke-width=".4"/>`}
  if(n===0)for(let k=-rr;k<rr;k+=4)o+=`<path d="M${x-rr},${y+k}L${x+rr},${y+k}" stroke="rgba(120,80,30,.25)" stroke-width="1.5"/>`});
 return o}

let S=`<defs>`;GEO.loc.forEach(l=>S+=`<clipPath id="c-${l.id}"><polygon points="${l.pts}"/></clipPath>`);S+=`</defs>`;
GEO.loc.forEach(l=>S+=`<g clip-path="url(#c-${l.id})"><polygon points="${l.pts}" fill="#dcc9a0"/>${city(P(l.pts),l.id,GEO.parks[l.id]||[])}</g><polygon points="${l.pts}" fill="none" stroke="#3d3833" stroke-width="3" stroke-linejoin="round"/>`);
S+=`<path d="${GEO.river}" fill="none" stroke="#ead9ae" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="${GEO.river}" fill="none" stroke="#4c7aa3" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="${GEO.river}" fill="none" stroke="#7ba3c6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>`;
GEO.loc.forEach(l=>{const p=P(l.pts);let A=0,x=0,y=0;p.forEach((q,i)=>{const r=p[(i+1)%p.length],c=q[0]*r[1]-r[0]*q[1];A+=c;x+=(q[0]+r[0])*c;y+=(q[1]+r[1])*c});A/=2;x/=6*A;y/=6*A;
 S+=`<text class="lab" x="${f(x)}" y="${f(y+4)}">${l.name}</text>`});
GEO.loc.forEach(l=>S+=`<polygon class="hit" id="h-${l.id}" points="${l.pts}" tabindex="0" role="button" aria-pressed="false" aria-label="${l.name}: ${DATA[l.id][0]} pending requests, ${DATA[l.id][1]} kg"/>`);
const svg=document.getElementById("map");svg.innerHTML=S;

const box=document.getElementById("box"),tip=document.getElementById("tip");let hov=null,sel=null;const hit={};
function update(){const a=hov||sel;
 GEO.loc.forEach(l=>{const on=l.id===sel;hit[l.id].classList.toggle("sel",on);hit[l.id].setAttribute("aria-pressed",on)});
 if(!a){tip.classList.remove("show");return}
 const l=GEO.loc.find(x=>x.id===a),d=DATA[a];
 tip.innerHTML=`<b>${l.name}</b><div><span>Pending requests</span><em>${d[0]}</em></div><div><span>Recyclable waste</span><em>${d[1]} kg</em></div><div><span>Est. value</span><em>₹${d[2].toLocaleString("en-IN")}</em></div>`;
 const r=hit[a].getBoundingClientRect(),b=box.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
 tip.style.left=Math.min(Math.max(r.left+r.width/2-b.left,w/2+8),b.width-w/2-8)+"px";
 const up=r.top-b.top>h+18;tip.style.top=(up?r.top-b.top-10:r.bottom-b.top+10)+"px";tip.style.transform=up?"translate(-50%,-100%)":"translate(-50%,0)";tip.classList.add("show")}
GEO.loc.forEach(l=>{const h=hit[l.id]=document.getElementById("h-"+l.id),pick=()=>{sel=sel===l.id?null:l.id;update()};
 h.onpointerenter=h.onfocus=()=>{hov=l.id;update()};h.onpointerleave=h.onblur=()=>{hov=null;update()};h.onclick=pick;
 h.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick()}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){sel=hov=null;update()}});
</script></body></html>
