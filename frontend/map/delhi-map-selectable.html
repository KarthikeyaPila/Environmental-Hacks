<script>
(function(){
 var svg=document.getElementById("delhi-map"),ds=[].slice.call(svg.querySelectorAll("path.district")),cur=null;
 function info(p){return{id:p.id.slice(9),name:p.getAttribute("data-district"),cx:+p.getAttribute("data-cx"),cy:+p.getAttribute("data-cy")}}
 function find(id){return ds.filter(function(p){return p.id==="district-"+id})[0]||null}
 function apply(id){cur=id;ds.forEach(function(p){var on=info(p).id===id;p.classList.toggle("selected",on);p.setAttribute("aria-pressed",on)});
  svg.classList.toggle("has-selection",!!id);var p=id?find(id):null;
  document.dispatchEvent(new CustomEvent("district-select",{detail:p?info(p):null}))}
 function select(id){if(find(id)&&id!==cur)apply(id)}
 function clear(){if(cur!==null)apply(null)}
 ds.forEach(function(p){var id=info(p).id;
  p.addEventListener("click",function(){cur===id?clear():select(id)});
  p.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();cur===id?clear():select(id)}})});
 document.addEventListener("keydown",function(e){if(e.key==="Escape")clear()});
 window.DelhiMap={select:select,clear:clear,selected:function(){return cur},pins:svg.querySelector("#pins")};
})();
</script></body></html>
