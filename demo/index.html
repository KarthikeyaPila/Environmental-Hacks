<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recovery Network Demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 720px; padding: 0 1.25rem; color: #19312a; }
      .status { border: 1px solid #b9d8c9; border-radius: 12px; padding: 1.25rem; background: #f2fbf5; }
      code { background: #edf2ef; border-radius: 4px; padding: .15rem .35rem; }
    </style>
  </head>
  <body>
    <h1>Recovery Network Demo</h1>
    <div class="status">
      <strong>Demo server is running.</strong>
      <p>This page is now connected to the local JSON API.</p>
      <button id="loadAreas">Load Delhi opportunities</button>
      <pre id="output">Click the button to query the backend.</pre>
    </div>
    <script>
      document.querySelector('#loadAreas').addEventListener('click', async () => {
        const response = await fetch('/api/kabadiwalas/kabadiwala_1/areas');
        document.querySelector('#output').textContent = JSON.stringify(await response.json(), null, 2);
      });
    </script>
  </body>
</html>
